# The results dashboard: docker compose up, then open http://localhost:3000
# (no login needed to view). Fill data/results.db first with
# python export_grafana.py --metrics <metrics.json> (run from the project folder).
services:
  grafana:
    image: grafana/grafana-oss:11.3.9
    ports:
      - "3000:3000"
    environment:
      # SQLite: reads data/results.db; Plotly: the square ROC plots.
      GF_INSTALL_PLUGINS: "frser-sqlite-datasource 3.5.0,nline-plotlyjs-panel 1.8.1"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/results.json"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./data:/data:ro
